# ============================================================
# ENI Mailing — Docker Compose
# Lancer depuis : backend/
#   docker compose up -d
# ============================================================
# Services :
#   db   → PostgreSQL 16 (psycopg3 compatible)
#   api  → FastAPI / Uvicorn (backend Python)
# ============================================================
name: eni-mailing

services:

  # ──────────────────────────────────────────────
  # Base de données PostgreSQL
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: eni_mailing_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eni_mailing
      POSTGRES_USER: eni_user
      POSTGRES_PASSWORD: change_this_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # accès local (pgAdmin, DBeaver…)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eni_user -d eni_mailing" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────
  # API FastAPI
  # ──────────────────────────────────────────────
  api:
    build:
      context: . # le docker-compose.yml EST dans backend/
      dockerfile: Dockerfile
    container_name: eni_mailing_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # attend que PostgreSQL réponde
    environment:
      DATABASE_URL: postgresql+psycopg://eni_user:change_this_password@db:5432/eni_mailing
      POSTGRES_DB: eni_mailing
      POSTGRES_USER: eni_user
      POSTGRES_PASSWORD: change_this_password
      SECRET_KEY: dev_secret_key_change_in_production_super_secure_hash_12345
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      BACKEND_CORS_ORIGINS: '["http://localhost:4200","http://127.0.0.1:4200","http://localhost:3000","http://localhost:5173"]'
      ENVIRONMENT: development
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@eni.mg}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ENI Mailing}
    volumes:
      - ./uploads:/app/uploads # persistance des pièces jointes
    ports:
      - "8000:8000"
    # L'entrypoint (entrypoint.sh) applique les migrations puis démarre Uvicorn

    # ──────────────────────────────────────────────
    # Volumes nommés
    # ──────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
